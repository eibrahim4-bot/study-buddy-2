<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;user-select:none}.stage{width:150px;height:160px;position:relative;display:flex;align-items:center;justify-content:center;-webkit-app-region:drag}.pet-button{width:140px;height:150px;padding:0;border:0;background:transparent;cursor:grab;filter:drop-shadow(0 5px 3px #8a6a4030);-webkit-app-region:drag;transition:filter .2s}.pet-button:hover{filter:drop-shadow(0 7px 5px #8a6a4050)}svg{width:100%;height:100%;overflow:visible}.pet{transform-origin:50% 85%;animation:bob 2.4s ease-in-out infinite}.tail{transform-origin:105px 93px;animation:wag .28s ease-in-out infinite alternate}.ear{transform-origin:center;animation:ear 3s ease-in-out infinite}.eyes{animation:blink 4.8s infinite}.hint{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:10px;color:#6d5d78;background:#fffdf0e8;border:1px solid #f1e4d0;border-radius:99px;padding:4px 8px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.stage:hover .hint{opacity:1}.close{position:absolute;right:7px;top:5px;border:0;border-radius:50%;width:20px;height:20px;background:#fff9;color:#8b7893;font-size:14px;opacity:0;cursor:pointer;-webkit-app-region:no-drag}.stage:hover .close{opacity:1}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes wag{from{transform:rotate(-20deg)}to{transform:rotate(24deg)}}@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(8deg)}}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}.sad .mouth{opacity:.5}.sad .tail{animation:none;transform:rotate(-18deg)}.sleepy .eyes{transform:scaleY(.35)}
</style></head><body><div class="stage" id="stage"><button class="pet-button" id="petButton" title="Click your buddy to open Focus Friend" aria-label="Open Focus Friend pet">
<svg id="animalArt" viewBox="0 0 140 150" role="img" aria-label="Cute cartoon puppy">
 <g class="pet" id="petGroup">
  <path class="tail" d="M96 91 Q126 88 118 62 Q116 54 111 59 Q110 78 96 76" fill="#D99135" stroke="#C27B25" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="70" cy="112" rx="31" ry="27" fill="#F3B94F"/><ellipse cx="55" cy="130" rx="12" ry="8" fill="#EBAA3D"/><ellipse cx="84" cy="130" rx="12" ry="8" fill="#EBAA3D"/>
  <path class="ear" d="M42 47 Q19 31 23 65 Q26 83 45 77Z" fill="#C9822A"/><path class="ear" d="M98 47 Q121 31 117 65 Q114 83 95 77Z" fill="#C9822A"/>
  <circle cx="70" cy="61" r="37" fill="#F5B84E"/><ellipse cx="70" cy="75" rx="22" ry="17" fill="#FFE5AD"/>
  <g class="eyes" fill="#493426"><ellipse cx="57" cy="59" rx="3.5" ry="5"/><ellipse cx="83" cy="59" rx="3.5" ry="5"/></g>
  <path d="M61 72 Q70 64 79 72 Q76 80 70 80 Q64 80 61 72Z" fill="#493426"/><path d="M70 80 Q65 88 59 82 M70 80 Q75 88 81 82" fill="none" stroke="#8D4B45" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="70" cy="87" rx="5" ry="4" fill="#F28DA5"/>
  <ellipse cx="47" cy="73" rx="7" ry="4" fill="#F58F91" opacity=".55"/><ellipse cx="93" cy="73" rx="7" ry="4" fill="#F58F91" opacity=".55"/>
  <path d="M57 34 Q70 24 82 35" stroke="#FFE0A0" stroke-width="5" stroke-linecap="round" fill="none"/>
 </g></svg></button><button class="close" id="close" title="Hide buddy">×</button><div class="hint">Click me to study ✨</div></div>
<script>
const art=document.getElementById('animalArt');let current={animal:'🐶',health:100,mood:'happy',running:false};
const colors={dog:['#F5B84E','#C9822A','#FFE5AD'],cat:['#EFA34B','#D97C31','#FFF0D9'],bunny:['#F4EBDD','#E9B7C3','#FFF9F1'],fox:['#F47C2A','#D85B1F','#FFF0D9'],panda:['#F6F2E9','#3C3B48','#FFFFFF'],duck:['#FFD54C','#F3A62A','#FFF5C5'],husky:['#9DA8B7','#667282','#FFFFFF'],dalmatian:['#F6F2E9','#3D3A3A','#FFFFFF'],shepherd:['#A96B35','#4C352B','#E7B56D']};
function render(s={}){current={...current,...s};const key=({'🐶':'dog','🐱':'cat','🐰':'bunny','🐥':'duck','🦊':'fox','🐼':'panda','🐸':'duck','🐧':'husky'})[current.animal]||'dog';const c=colors[key];art.querySelectorAll('.pet').forEach(el=>{el.classList.toggle('sad',current.mood==='sad'||current.mood==='panic'||current.mood==='fainted');el.classList.toggle('sleepy',current.mood==='sleepy')});art.querySelectorAll('path,ellipse,circle').forEach(el=>{if(el.classList.contains('tail')){el.setAttribute('fill',c[1]);el.setAttribute('stroke',c[1])}});const head=art.querySelector('circle');if(head)head.setAttribute('fill',c[0]);const ears=art.querySelectorAll('.ear');ears.forEach(el=>el.setAttribute('fill',c[1]));art.querySelectorAll('ellipse').forEach(el=>{if(el.getAttribute('fill')==='#F3B94F')el.setAttribute('fill',c[0]);if(el.getAttribute('fill')==='#EBAA3D')el.setAttribute('fill',c[1]);if(el.getAttribute('fill')==='#FFE5AD')el.setAttribute('fill',c[2])});document.querySelector('.hint').textContent=current.mood==='sad'?'Let’s refocus 💗':current.mood==='sleepy'?'Taking a tiny break 💤':current.running?'You’ve got this! ✨':'Click me to study ✨';}
if(window.focusFriend)window.focusFriend.onBuddyState(render);document.getElementById('petButton').addEventListener('click',()=>window.focusFriend?.openDashboard());document.getElementById('close').addEventListener('click',e=>{e.stopPropagation();window.focusFriend?.closeBuddy()});
// Electron's native draggable region handles normal movement. This pointer fallback helps when dragging the pet itself.
let dragging=false,startX=0,startY=0;document.getElementById('petButton').addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;startX=e.screenX;startY=e.screenY});document.addEventListener('pointerup',()=>dragging=false);
</script></body></html>
